name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          # Authenticate mise's GitHub releases API calls so tool installs are not
          # capped at the 60 req/hr unauthenticated rate limit.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # cargo-audit below is a CI tool, not a workspace dependency, so its own
          # (large) dependency tree needs cache-all-crates to avoid a from-source
          # recompile on every run.
          cache-all-crates: "true"
      - name: Lint & format
        run: hk check --all
      - name: Check
        run: mise run check
      - name: Unit tests
        run: mise run test
      - name: Build
        run: mise run build

      # RUSTSEC advisory scan. Advisory-only: continue-on-error so a newly
      # published advisory cannot block unrelated merges before triage.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Cargo audit (RUSTSEC advisories)
        continue-on-error: true
        run: cargo audit

name: Release

# Builds and publishes svmm binaries for macOS, Linux, and Windows.
#
# Triggered either by a `v*` tag push (the normal release-plz-driven path) or
# by workflow_dispatch naming an existing tag to (re)build — the latter is how
# historical releases get backfilled, since a tag pointing at a commit that
# predates this workflow's existence has no copy of it in its tree and so a
# plain push to that tag triggers nothing. See
# .context/plans/2026-08-24-add-release-and-changelog-pipeline.md (Decision 2)
# and docs/ADR/adr-011-release-plz-plus-hand-authored-release-workflow.md.

on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version of an EXISTING tag to build and release, without the leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-binaries:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            native: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            native: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
      - name: Setup mise (rust only)
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Only the pinned Rust toolchain is needed to build the binary.
          # Installing the full mise.toml set (as ci.yml does) pulls in
          # ffmpeg's asdf plugin, which has no Windows support and needs
          # nasm on Linux (absent at some historical commits this workflow
          # can be dispatched against) — neither is a build-time dependency.
          install_args: rust
      - name: Add cross-compile target
        if: ${{ !matrix.native }}
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Smoke test (native targets only)
        # A cross-compiled binary (e.g. x86_64 built on an arm64 macOS runner)
        # can't execute on the build host, so this only proves native legs run.
        if: matrix.native
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/svmm"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = "svmm-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/svmm.exe" "$dest/svmm.exe"
          Compress-Archive -Path "$dest/*" -DestinationPath "svmm-${{ matrix.target }}.zip"
      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          DEST="svmm-${{ matrix.target }}"
          mkdir "$DEST"
          cp "target/${{ matrix.target }}/release/svmm" "$DEST/svmm"
          tar -czf "svmm-${{ matrix.target }}.tar.gz" "$DEST"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            svmm-${{ matrix.target }}.tar.gz
            svmm-${{ matrix.target }}.zip
          if-no-files-found: ignore

  create-release:
    name: Create/update release
    needs: build-binaries
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
          fetch-depth: 0
      - name: Resolve tag
        run: echo "TAG=${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}" >> "$GITHUB_ENV"
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
      - name: Check for an existing release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "EXISTS=false" >> "$GITHUB_ENV"
          fi
      - name: Upload to an existing release
        # The historical-backfill path (Decision 2): the release and its notes
        # were created by hand before this workflow ran; only attach binaries.
        if: env.EXISTS == 'true'
        run: gh release upload "$TAG" artifacts/* --clobber
      - name: Extract release notes from CHANGELOG.md
        if: env.EXISTS == 'false'
        run: |
          if [ -f CHANGELOG.md ]; then
            awk '/^## \[/{if(found) exit; found=1} found{print}' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "No changelog available for this release." > release-notes.md
          fi
      - name: Create a new release
        if: env.EXISTS == 'false'
        run: gh release create "$TAG" --title "$TAG" --notes-file release-notes.md artifacts/*

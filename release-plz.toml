[workspace]
# svmm is a CLI tool, not a library for other crates to depend on — no
# crates.io presence is wanted (see the plan's Scope / ADR-011). Without this,
# `release-plz release` tries `cargo publish` and fails on a missing
# CARGO_REGISTRY_TOKEN, aborting before it ever creates the git tag/release.
publish = false
# Only release when the latest commit on main is the merge of a release-plz
# PR, not on every push. The default (true) tries to release on every commit,
# which — combined with Cargo.toml already declaring "0.1.0" pre-pipeline —
# fired an immediate, unreviewed release attempt on this workflow's first run.
release_always = false
